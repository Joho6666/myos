# Next.js standalone 打包需要复制被追踪的依赖。pnpm 默认的符号链接布局
# 会让 Next 尝试重建目录符号链接，而 Windows 默认不允许普通用户创建
# （需要开发者模式），导致 EPERM。hoisted 布局让 node_modules 变成真实的
# 平铺目录，Next 直接复制文件即可。
nodeLinker: hoisted

allowBuilds:
  # NSIS 打包不需要 Squirrel installer，禁用它的构建脚本
  electron-winstaller: false
  electron: true
  esbuild: true
  sharp: true
onlyBuiltDependencies:
  - electron
  - esbuild
  - sharp
